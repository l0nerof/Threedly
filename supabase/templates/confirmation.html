<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>Threedly — підтвердження email</title>
  </head>
  <body>
    <h1>Підтвердження email / Email confirmation</h1>
    <p>Введіть цей одноразовий код на сторінці підтвердження Threedly:</p>
    <p lang="en">Enter this one-time code on the Threedly verification page:</p>
    <p><strong>{{ .Token }}</strong></p>
    <p>Якщо ви не створювали акаунт, проігноруйте цей лист.</p>
    <p lang="en">If you did not create an account, ignore this email.</p>
  </body>
</html>
